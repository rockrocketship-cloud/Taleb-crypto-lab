<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rekap Harian Owner — Lokalin</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#352720}*{box-sizing:border-box}body{margin:0;background:#f7f2eb}header{background:#a62925;color:white;padding:24px 18px;border-radius:0 0 24px 24px}header a{color:#fff;text-decoration:none}main{max-width:920px;margin:auto;padding:16px}h1{margin:14px 0 5px;font-size:27px}h2{font-size:20px}.panel,.card{background:#fff;border:1px solid #eadfd4;border-radius:18px;padding:17px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:14px;border-radius:14px;background:#f8f0e9}.stat small{display:block;color:#806e65}.stat b{font-size:21px;overflow-wrap:anywhere}.stat:last-child{grid-column:span 2;background:#f5dfd9}input,textarea{width:100%;padding:12px;border:1px solid #dfd2c7;border-radius:10px;font:inherit;font-size:16px;background:#fff}textarea{min-height:95px}label{display:block;font-size:13px;font-weight:700;margin:8px 0 5px}button{padding:12px 16px;border:0;border-radius:11px;background:#a62925;color:white;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#f0e5db;color:#69453b}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{color:#806e65;font-size:13px}.note{background:#fcf7f2;border:1px solid #eee2d8;border-radius:12px;padding:12px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}.item{padding:9px 0;border-bottom:1px solid #e7d9cf}.amounts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}.amounts>div{background:#f8f0e9;padding:10px;border-radius:11px;overflow-wrap:anywhere}.amounts small{display:block;color:#826f65}.amounts b{font-size:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top b{font-size:19px}.hide{display:none!important}.overlay{position:fixed;inset:0;background:#231510a8;display:grid;place-items:center;padding:12px;z-index:9}.dialog{background:white;border-radius:18px;padding:18px;width:min(100%,560px);max-height:92vh;overflow:auto}.error{color:#a62925}.info{color:#357049}@media(max-width:410px){.amounts{grid-template-columns:1fr 1fr}.amounts>div:last-child{grid-column:span 2}}</style></head><body><header><a href="./index.html">← Lokalin Management</a><h1>Rekap Laporan Harian</h1><div>Owner · Penjualan, pengeluaran, dan catatan</div></header><main><section class="panel"><div id="who" class="muted">Memeriksa akun…</div><div class="grid"><div><label>Dari tanggal</label><input type="date" id="from"></div><div><label>Sampai tanggal</label><input type="date" id="to"></div></div><div class="buttons"><button id="load">Muat Laporan</button><button id="csv" class="secondary">Export CSV</button></div><p id="status" class="muted"></p></section><section class="stats"><div class="stat"><small>Penjualan</small><b id="sales">Rp0</b></div><div class="stat"><small>Pengeluaran</small><b id="costs">Rp0</b></div><div class="stat"><small>Selisih Operasional</small><b id="net">Rp0</b></div></section><p id="count" class="muted"></p><div id="cards"></div></main><div class="overlay hide" id="overlay"><form class="dialog" id="editForm"><h2>Edit Laporan</h2><div class="grid"><div><label>Tanggal</label><input id="eDate" type="date" required></div><div><label>Pelapor</label><input id="eName" required maxlength="100"></div></div><div class="grid" id="editFields"></div><label>Catatan</label><textarea id="eNote" maxlength="2000"></textarea><p class="muted" id="itemHint"></p><p id="editStatus" class="error"></p><div class="buttons"><button type="button" class="secondary" id="cancel">Batal</button><button type="submit" id="save">Simpan Perubahan</button></div></form></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://kwhtqqrzeifmntdtugvg.supabase.co','sb_publishable_JGQ9jpXgEb3IMl0YjY3Txg_cQKy02Fs');
const $=id=>document.getElementById(id),money=n=>'Rp'+Number(n||0).toLocaleString('id-ID'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sales=['tunai','qris','transfer','edc','online','lain_penjualan'],costs=['kitchen','bar','dw','makan','lain_biaya'],fields=[...sales,...costs],names={tunai:'Tunai',qris:'QRIS',transfer:'Transfer',edc:'EDC',online:'Online',lain_penjualan:'Penjualan Lain',kitchen:'Belanja Kitchen',bar:'Belanja Bar',dw:'Daily Worker',makan:'Uang Makan',lain_biaya:'Biaya Lain'};
const mark='\n[LOKALIN_ITEMS_V1]';let records=[],editing=null,items=null,role='';const sum=(r,keys)=>keys.reduce((a,k)=>a+Number(r[k]||0),0);const dateWita=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Makassar',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function decode(s){let i=String(s||'').indexOf(mark);if(i<0)return {note:String(s||''),items:null};try{return {note:String(s).slice(0,i),items:JSON.parse(String(s).slice(i+mark.length))}}catch{return {note:String(s||''),items:null}}}
function noteHTML(s){const d=decode(s);let out='<div class="note">'+(d.note?esc(d.note):'<span class="muted">Tidak ada catatan tambahan</span>');for(const k of ['kitchen','bar']){const a=d.items?.[k]||[];if(a.length){out+='<div style="margin-top:10px"><b>'+esc(names[k])+'</b>';for(const x of a)out+='<div class="item">'+esc(x.nama)+' · '+esc(x.jumlah)+' '+esc(x.satuan)+' × '+money(x.harga)+'</div>';out+='</div>'}}return out+'</div>'}
async function load(){if(role!=='owner')return;$('status').textContent='Memuat…';try{const {data,error}=await db.from('laporan_harian').select('*').gte('tanggal',$('from').value).lte('tanggal',$('to').value).order('tanggal',{ascending:false}).order('created_at',{ascending:false}).limit(2000);if(error)throw error;records=data||[];$('sales').textContent=money(records.reduce((a,r)=>a+sum(r,sales),0));$('costs').textContent=money(records.reduce((a,r)=>a+sum(r,costs),0));$('net').textContent=money(records.reduce((a,r)=>a+sum(r,sales)-sum(r,costs),0));$('count').textContent=records.length+' laporan ditemukan'+(records.length===2000?' (batas 2000)':'');$('cards').innerHTML=records.map(r=>'<article class="card"><div class="top"><div><b>'+esc(r.pelapor)+'</b><div class="muted">'+esc(r.tanggal)+'</div></div><span class="muted">Tersimpan</span></div><div class="amounts"><div><small>Penjualan</small><b>'+money(sum(r,sales))+'</b></div><div><small>Pengeluaran</small><b>'+money(sum(r,costs))+'</b></div><div><small>Selisih</small><b>'+money(sum(r,sales)-sum(r,costs))+'</b></div></div><b>Catatan & Rincian Belanja</b>'+noteHTML(r.catatan)+'<div class="buttons"><button data-edit="'+esc(r.id)+'">Edit Laporan</button></div></article>').join('')||'<div class="panel">Belum ada laporan untuk tanggal ini.</div>';$('status').textContent='Data berhasil dimuat.'}catch(e){$('status').textContent='Gagal memuat: '+e.message}}
$('editFields').innerHTML=fields.map(k=>'<div><label>'+esc(names[k])+'</label><input type="number" min="0" step="1" id="e_'+k+'" required></div>').join('');
$('cards').onclick=e=>{const b=e.target.closest('[data-edit]');if(!b||role!=='owner')return;const r=records.find(x=>String(x.id)===b.dataset.edit);if(!r)return;editing=r.id;const d=decode(r.catatan);items=d.items;$('eDate').value=r.tanggal;$('eName').value=r.pelapor;$('eNote').value=d.note;fields.forEach(k=>$('e_'+k).value=r[k]||0);$('itemHint').textContent=items?'Rincian per item dipertahankan. Editor ini mengubah total nominal dan catatan umum, bukan rincian per item.':'';$('editStatus').textContent='';$('overlay').classList.remove('hide')};
$('cancel').onclick=()=>{$('overlay').classList.add('hide');editing=null};
$('editForm').onsubmit=async e=>{e.preventDefault();if(role!=='owner'||editing===null)return;const payload={tanggal:$('eDate').value,pelapor:$('eName').value.trim()};for(const k of fields){const n=Number($('e_'+k).value);if(!Number.isSafeInteger(n)||n<0||n>100000000000){$('editStatus').textContent='Periksa nominal '+names[k];return}payload[k]=n}payload.catatan=$('eNote').value.trim()+(items?mark+JSON.stringify(items):'');$('save').disabled=true;$('editStatus').textContent='Menyimpan…';try{const {data,error}=await db.from('laporan_harian').update(payload).eq('id',editing).select('id');if(error)throw error;if(!data?.length)throw Error('Tidak ada data yang diperbarui. Periksa izin UPDATE Owner.');$('overlay').classList.add('hide');editing=null;await load()}catch(e){$('editStatus').textContent='Gagal: '+e.message}finally{$('save').disabled=false}};
$('load').onclick=load;$('csv').onclick=()=>{if(role!=='owner')return;const keys=['tanggal','pelapor',...fields,'catatan'];const rows=[keys,...records.map(r=>keys.map(k=>r[k]??''))];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='rekap-harian-lokalin.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
const d=dateWita();$('from').value=d.slice(0,8)+'01';$('to').value=d;try{const {data:{user},error}=await db.auth.getUser();if(error||!user)throw Error('Silakan login dahulu melalui Lokalin Management di browser yang sama.');const roles=await db.from('app_roles').select('role').eq('user_id',user.id).limit(1);if(roles.error)throw roles.error;role=roles.data?.[0]?.role||'';if(role!=='owner')throw Error('Halaman hanya untuk akun Owner.');$('who').textContent=user.email+' · Owner';await load()}catch(e){$('who').textContent=e.message;$('status').textContent='Akses belum tersedia.'}
</script></body></html>
